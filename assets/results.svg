<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-labelledby="t d"><title id="t">OrderBook-DST pass rates</title><desc id="d">Pass rate on the 11 implementation tasks for seven free-tier models: nemotron_ultra 100%, mistral_large 93.9%, gemini_35_flash 87.5% (incomplete), gemma_26b 81.8%, flash_lite 78.8%, nemotron_nano 36.4%, ministral_8b 36.4%.</desc><style>:root{--bg:#111111;--panel:#181818;--card:#1E1E1E;--paper:#F2F0EB;--paperink:#111111;--ink:#F2F0EB;--mute:#8E8B84;--line:#2A2A2A;--dim:#333333;--accent:#FF5A3C;--brass:#BDB8AC;--ok:#8E8B84;--t0:#222222;--l0:#1A1A1A;--r0:#1E1E1E;--t1:#4B3A36;--l1:#3A2C29;--r1:#42332F;--t2:#8C4A3E;--l2:#6E3A31;--r2:#7B4136;--t3:#D84A32;--l3:#A93826;--r3:#BD402B;--t4:#FF5A3C;--l4:#C94530;--r4:#E04F36;}@media (prefers-color-scheme: light){:root{--bg:#F2F0EB;--panel:#E9E6DF;--card:#1E1E1E;--paper:#F2F0EB;--paperink:#111111;--ink:#111111;--mute:#6B6860;--line:#D9D5CC;--dim:#CFCBC1;--accent:#E8412C;--brass:#55524A;--ok:#8E8B84;--t0:#E4E0D6;--l0:#D8D3C7;--r0:#DDD8CC;--t1:#E0B8AE;--l1:#C79C92;--r1:#D3AAA0;--t2:#D98672;--l2:#B86A58;--r2:#C47866;--t3:#D2452F;--l3:#A8341F;--r3:#BC3A25;--t4:#B0200F;--l4:#8A180A;--r4:#9C1C0C;}}.sans{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif}.mono{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-variant-numeric:tabular-nums}.t0{fill:var(--t0)}.l0{fill:var(--l0)}.r0{fill:var(--r0)}.t1{fill:var(--t1)}.l1{fill:var(--l1)}.r1{fill:var(--r1)}.t2{fill:var(--t2)}.l2{fill:var(--l2)}.r2{fill:var(--r2)}.t3{fill:var(--t3)}.l3{fill:var(--l3)}.r3{fill:var(--r3)}.t4{fill:var(--t4)}.l4{fill:var(--l4)}.r4{fill:var(--r4)}@keyframes rise{from{opacity:0;transform:translateY(8px)}}@keyframes grow{from{transform:scaleX(0)}}@keyframes pop{from{opacity:0;transform:scale(.2)}}@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.bar{transform-box:fill-box;