"280" font-size="14" fill="var(--ink)" font-weight="600" text-anchor="start" letter-spacing="0.00" >ministral_8b</text><rect x="190" y="266" width="560" height="20" rx="4" fill="var(--dim)" opacity=".55"/></g><rect class="bar" style="animation-delay:0.68s" x="190" y="266" width="204" height="20" rx="4" fill="var(--brass)"/><text class="mono" x="766" y="281" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="start" letter-spacing="0.00" >36.4%</text><text class="sans" x="28" y="316" font-size="11.5" fill="var(--mute)" font-weight="400" text-anchor="start" letter-spacing="0.00" >329 real trials, 7 free-tier models, 3 trials per task. Pass means every hidden check and all 20 seeded 200-event simulations. Dashed: rate-limited, incomplete.</text></svg>
