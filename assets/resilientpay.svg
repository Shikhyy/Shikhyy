<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 352" width="900" height="352" role="img" aria-labelledby="t d"><title id="t">ResilientPay: what the simulator measured</title><desc id="d">Six results from ResilientPay's deterministic simulation: 98.5 percent NFC success, 93.0 percent SMS fallback delivery, 62.3 percent smaller payloads, zero false acceptances across 2,000 fault-injected transactions, zero paise of undetected exposure across 900 double-spend trials, and a hash-chain audit log 3.2 times faster on writes and 7.2 times faster to verify.</desc><style>:root{--bg:#111111;--panel:#181818;--card:#1E1E1E;--paper:#F2F0EB;--paperink:#111111;--ink:#F2F0EB;--mute:#8E8B84;--line:#2A2A2A;--dim:#333333;--accent:#FF5A3C;--brass:#BDB8AC;--ok:#8E8B84;--t0:#222222;--l0:#1A1A1A;--r0:#1E1E1E;--t1:#4B3A36;--l1:#3A2C29;--r1:#42332F;--t2:#8C4A3E;--l2:#6E3A31;--r2:#7B4136;--t3:#D84A32;--l3:#A93826;--r3:#BD402B;--t4:#FF5A3C;--l4:#C94530;--r4:#E04F36;}@media (prefers-color-scheme: light){:root{--bg:#F2F0EB;--panel:#E9E6DF;--card:#1E1E1E;--paper:#F2F0EB;--paperink:#111111;--ink:#111111;--mute:#6B6860;--line:#D9D5CC;--dim:#CFCBC1;--accent:#E8412C;--brass:#55524A;--ok:#8E8B84;--t0:#E4E0D6;--l0:#D8D3C7;--r0:#DDD8CC;--t1:#E0B8AE;--l1:#C79C92;--r1:#D3AAA0;--t2:#D98672;--l2:#B86A58;--r2:#C47866;--t3:#D2452F;--l3:#A8341F;--r3:#BC3A25;--t4:#B0200F;--l4:#8A180A;--r4:#9C1C0C;}}.sans{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif}.mono{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-variant-numeric:tabular-nums}.t0{fill:var(--t0)}.l0{fill:var(--l0)}.r0{fill:var(--r0)}.t1{fill:var(--t1)}.l1{fill:var(--l1)}.r1{fill:var(--r1)}.t2{fill:var(--t2)}.l2{fill:var(--l2)}.r2{fill:var(--r2)}.t3{fill:var(--t3)}.l3{fill:var(--l3)}.r3{fill:var(--r3)}.t4{fill:var(--t4)}.l4{fill:var(--l4)}.r4{fill:var(--r4)}@keyframes rise{from{opacity:0;transform:translateY(8px)}}@keyframes grow{from{transform:scaleX(0)}}@keyframes pop{from{opacity:0;transform:scale(.2)}}@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.up{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}</style><rect x="1" y="1" width="898" height="350" rx="8" fill="var(--bg)" stroke="var(--line)" stroke-width="2"/><rect x="1" y="1" width="898" height="350" rx="8" fill="var(--panel)" stroke="var(--line)" stroke-width="2"/><path d="M1 9a8 8 0 0 1 8-8h882a8 8 0 0 1 8 8v24H1z" fill="var(--accent)"/><text class="mono" x="28" y="25" font-size="11" fill="var(--paper)" font-weight="700" text-anchor="start" letter-spacing="1.08" >RESILIENTPAY  /  WHAT THE SIMULATOR MEASURED</text><g class="up" style="animation-delay:0.00s"><rect x="36" y="56" width="268" height="122" rx="6" fill="var(--bg)" stroke="var(--line)" stroke-width="1.5"/><text class="sans" x="56" y="108" font-size="38" fill="var(--ink)" font-weight="800" text-anchor="start" letter-spacing="-0.45" >98.5%</text><text class="sans" x="56" y="134" font-size="14" fill="var(--ink)" font-weight="600" text-anchor="start" letter-spacing="0.00" >NFC success</text><text class="sans" x="56" y="154" font-size="12" fill="var(--mute)" font-weight="400" text-anchor="start" letter-spacing="0.00" >19.7 ms, 1,000 transactions</text><text class="sans" x="56" y="169" font-size="12" fill="var(--mute)" font-weight="400" text-anchor="start" letter-spacing="0.00" >across 5 channels</text></g><g class="up" style="animation-delay:0.09s"><rect x="316" y="56" width="268" height="122" rx="6" fill="var(--bg)" stroke="var(--line)" stroke-width="1.5"/><text class="sans" x="336" y="108" font-size="38" fill="var(--ink)" font-weight="800" text-anchor="start" letter-spacing="-0.45" >93.0%</text><text class="sans" x="336" y="134" font-size="14" fill="var(--ink)" font-weight="600" text-anchor="start" letter-spacing="0.00" >SMS fallback delivery</text><text class="sans" x="336" y="154" font-size="12" fill="var(--mute)" font-weight="400" text-anchor="start" letter-spacing="0.00" >over degraded cellular links</text></g><g class="up" style="animation-delay:0.18s"><rect x="596" y="56" width="268" height="122" rx="6" fill="var(--bg)" stroke="var(--line)" stroke-width="1.5"/><text class="sans" x="616" y="108" font-size="38" fill="var(--ink)" font-weight="800" text-anchor="start" letter-spacing="-0.45" >62.3%</text><text class="sans" x="616" y="134" font-size="14" fill="var(--ink)" font-weight="600" text-anchor="start" letter-spacing="0.00" >smaller payloads</text><text class="sans" x="616" y="154" font-size="12" fill="var(--mute)" font-weight="400" text-anchor="start" letter-spacing="0.00" >106 B against 281 B for JSON,</text><text class="sans" x="616" y="169" font-size="12" fill="var(--mute)" font-weight="400" text-anchor="start" letter-spacing="0.00" >SMS segments cut from 4 to 2</text></g><g class="up" style="animation-delay:0.27s"><rect x="36" y="190" width="268" height="122" rx="6" fill="var(--bg)" stroke="var(--line)" stroke-width="1.5"/><text class="sans" x="56" y="242" font-size="38" fill="var(--accent)" font-weight="800" text-anchor="start" letter-spacing="-0.45" >0</text><text class="sans" x="56" y="268" font-size="14" fill="var(--ink)" font-weight="600" text-anchor="start" letter-spacing="0.00" >false acceptances</text><text class="sans" x="56" y="288" font-size="12" fill="var(--mute)" font-weight="400" text-anchor="start" letter-spacing="0.00" >2,000 fault-injected transactions,</text><text class="sans" x="56" y="303" font-size="12" fill="var(--mute)" font-weight="400" text-anchor="start" letter-spacing="0.00" >100% convergence</text></g><g class="up" style="animation-delay:0.36s"><rect x="316" y="190" width="268" height="122" rx="6" fill="var(--bg)" stroke="var(--line)" stroke-width="1.5"/><text class="sans" x="336" y="242" font-size="38" fill="var(--accent)" font-weight="800" text-anchor="start" letter-spacing="-0.45" >0 paise</text><text class="sans" x="336" y="268" font-size="14" fill="var(--ink)" font-weight="600" text-anchor="start" letter-spacing="0.00" >undetected exposure</text><text class="sans" x="336" y="288" font-size="12" fill="var(--mute)" font-weight="400" text-anchor="start" letter-spacing="0.00" >900 double-spend and replay trials,</text><text class="sans" x="336" y="303" font-size="12" fill="var(--mute)" font-weight="400" text-anchor="start" letter-spacing="0.00" >caught by the second transaction</text></g><g class="up" style="animation-delay:0.45s"><rect x="596" y="190" width="268" height="122" rx="6" fill="var(--bg)" stroke="var(--line)" stroke-width="1.5"/><text class="sans" x="616" y="242" font-size="38" fill="var(--ink)" font-weight="800" text-anchor="start" letter-spacing="-0.45" >3.2x / 7.2x</text><text class="sans" x="616" y="268" font-size="14" fill="var(--ink)" font-weight="600" text-anchor="start" letter-spacing="0.00" >hash chain vs Merkle audit</text><text class="sans" x="616" y="288" font-size="12" fill="var(--mute)" font-weight="400" text-anchor="start" letter-spacing="0.00" >faster writes, faster</text><text class="sans" x="616" y="303" font-size="12" fill="var(--mute)" font-weight="400" text-anchor="start" letter-spacing="0.00" >verification</text></g><text class="sans" x="36" y="338" font-size="12" fill="var(--mute)" font-weight="400" text-anchor="start" letter-spacing="0.00" >Deterministic simulation with test identities and simulated value. Not real payments.</text></svg>
