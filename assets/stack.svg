<svg xmlns="http://www.w3.org/2000/svg" width="1200" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">Grouped technology stack</title>
  <desc id="desc">Languages, frameworks, databases, cloud platforms</desc>
  <rect width="1200" height="260" fill="#0a0f28" rx="16"/><text x="28" y="50" fill="#edf1ff" font-size="34" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Tech Stack</text><text x="30" y="88" fill="#9db4ff" font-size="18" font-family="Segoe UI, Arial, sans-serif">Languages</text><text x="230" y="88" fill="#d8e0ff" font-size="18" font-family="Segoe UI, Arial, sans-serif">TypeScript, JavaScript, Python, Rust, Kotlin, Solidity</text><text x="30" y="128" fill="#9db4ff" font-size="18" font-family="Segoe UI, Arial, sans-serif">Frameworks / Tools</text><text x="230" y="128" fill="#d8e0ff" font-size="18" font-family="Segoe UI, Arial, sans-serif">React, Next.js, Node.js, FastAPI, Tailwind CSS, Docker</text><text x="30" y="168" fill="#9db4ff" font-size="18" font-family="Segoe UI, Arial, sans-serif">Databases</text><text x="230" y="168" fill="#d8e0ff" font-size="18" font-family="Segoe UI, Arial, sans-serif">PostgreSQL, MySQL, MongoDB, Redis, SQLite</text><text x="30" y="208" fill="#9db4ff" font-size="18" font-family="Segoe UI, Arial, sans-serif">Cloud / Platforms</text><text x="230" y="208" fill="#d8e0ff" font-size="18" font-family="Segoe UI, Arial, sans-serif">GitHub Actions, AWS, Vercel, Android, Linux</text>
</svg>
