name: Update profile

# Refreshes the numbers, open source activity, recent repositories, language chart and
# contribution graphics, then commits only if something actually changed.
on:
  schedule:
    - cron: "17 */6 * * *"      # every six hours
  workflow_dispatch:             # run it by hand from the Actions tab
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh data and regenerate graphics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update profile data"
            git push
          fi
